plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }
version = '0.1.0'
group = 'dev.windove'
loom {
    splitEnvironmentSourceSets()
    mods { windove_bridge { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.159.0+26.2'
    compileOnly files('libs/baritone-fabric-26.2.jar')
    runtimeOnly files('libs/baritone-fabric-26.2.jar')
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }

// Dependency-free executable regressions exercise the same pure policy/search used by the client.
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output
tasks.register('survivalTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.windove.bridge.SurvivalTest'
}
tasks.named('check') { dependsOn survivalTest }

// survivalTest above is an executable assertion harness, not a JUnit suite.
tasks.named('test') { failOnNoDiscoveredTests = false }
